name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  dart-and-flutter:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: dart pub get
      - run: dart analyze
      - run: dart format --output=none --set-exit-if-changed .
      - working-directory: packages/flutter_avif_native
        run: flutter test
