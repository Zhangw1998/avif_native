name: Publish to pub.dev

on:
  push:
    tags: ["v*"]

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      # Exchange the GitHub OIDC token for pub.dev credentials. Without this
      # `dart pub publish` falls back to the interactive OAuth flow and waits
      # for authorization forever on a CI runner.
      - name: Authenticate to pub.dev
        shell: bash
        run: |
          token=$(curl -sSf \
            -H "Authorization: Bearer ${ACTIONS_ID_TOKEN_REQUEST_TOKEN}" \
            "${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=https://pub.dev" |
            jq -r .value)
          test -n "$token"
          echo "$token" | dart pub token add https://pub.dev
      - name: Verify version
        shell: bash
        run: |
          version=$(awk '/^version:/{print $2; exit}' pubspec.yaml)
          [[ "$GITHUB_REF_NAME" == "v$version" ]]
      - run: dart pub get
      - run: dart test
      - run: tool/test_profiles.sh
      - run: dart pub publish --force
