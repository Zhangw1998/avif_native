name: Publish to pub.dev

on:
  push:
    tags: ["v*"]

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Verify version
        shell: bash
        run: |
          version=$(awk '/^version:/{print $2; exit}' pubspec.yaml)
          [[ "$GITHUB_REF_NAME" == "v$version" ]]
      - run: dart pub get
      - run: dart test
      - run: tool/test_profiles.sh
      - run: dart pub publish --force
